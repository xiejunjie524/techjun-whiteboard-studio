name: validate
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/*.py
      - run: python scripts/techjun.py --help
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - run: pytest -q
      - run: python scripts/validate_project.py examples/scene-01-seed-growth.png examples/scene-01-seed-growth.annotation.json
